[package]
name = "dnd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Drag and drop files from and to the terminal (macOS, Linux)"
readme = "README.md"

[[bin]]
name = "dnd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
percent-encoding = "2.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSBezierPath",
    "NSBitmapImageRep",
    "NSClipView",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSImageView",
    "NSLayoutAnchor",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSRunningApplication",
    "NSScrollView",
    "NSStackView",
    "NSText",
    "NSTextField",
    "NSUserInterfaceLayout",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[profile.release]
lto = true
strip = true
